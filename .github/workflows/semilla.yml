# Copia de respaldo de los datos: cada 3 horas baja todas las series (monitor/semilla.py) y las publica en la rama
# `datos` (un solo archivo, sin historial). La página arranca con esa copia después de cada reinicio y la usa si una
# fuente se cae. Publicar en `datos` no reinicia la página: Streamlit Cloud solo mira la rama `main`.
name: Semilla

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write  # para publicar la rama `datos` (no toca `main`)

concurrency:
  group: semilla
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Bajar todas las series
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python monitor/semilla.py "$RUNNER_TEMP/semilla"
      - name: Publicar en la rama datos
        run: |
          cd "$RUNNER_TEMP/semilla"
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semilla.json.gz
          git commit -q -m "Copia de respaldo de los datos"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
